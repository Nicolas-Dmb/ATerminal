name: Build & Deploy

on:
  push:
    branches: [main, feat/ci_cd]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/nicolas-dmb/codara

jobs:
  # ───────────────────────────── BUILD ─────────────────────────────
  # Build des 3 images et push vers GHCR. Pas de secret de registry :
  # GITHUB_TOKEN suffit pour pousser dans le GHCR du repo.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: ./api
          - service: engine
            context: ./engine
          - service: frontend
            context: ./frontend
            # VITE_API_URL : public (inliné dans le bundle), donc une *variable*
            # de repo, pas un secret. Settings → Variables → New variable.
            build_args: |
              VITE_API_URL=${{ vars.VITE_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/dockerfile
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ──────────────────────────── DEPLOY ─────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Vérif secret présent
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ SSH_PRIVATE_KEY est VIDE — le secret n'est pas vu par ce run"
            exit 1
          fi
          echo "✅ SSH_PRIVATE_KEY présent (${#KEY} caractères)"
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      # On envoie le compose de prod sur le VPS (les .env applicatifs y sont
      # déjà, posés une fois à la main, et ne sont jamais écrasés).
      - name: Copie du compose vers le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml
          target: /projects/aterminal

      - name: Pull + up sur le VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # GHCR_TOKEN = GITHUB_TOKEN du run : valide pour tirer les images
          # pendant ce run → pas de PAT à stocker sur le VPS.
          envs: GHCR_TOKEN,GHCR_USER,TAG
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /projects/aterminal
            echo "TAG=$TAG" > .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            docker logout ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          TAG: ${{ github.sha }}