# Compose de PRODUCTION : on ne build pas, on tire les images déjà construites
# par la CI depuis GHCR. Le tag est piloté par la variable TAG (cf. le fichier
# .env posé à côté de ce compose sur le VPS : "TAG=<sha>"), avec fallback latest.
#
# Les secrets applicatifs (DB, CORS, etc.) vivent dans les .env présents sur le
# VPS (./api/.env, ./engine/.env) — GitHub ne les voit jamais.
services:
  api:
    image: ghcr.io/nicolas-dmb/codara-api:${TAG:-latest}
    container_name: aterminal-api
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  engine:
    image: ghcr.io/nicolas-dmb/codara-engine:${TAG:-latest}
    container_name: aterminal-engine
    env_file:
      - ./engine/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    image: ghcr.io/nicolas-dmb/codara-frontend:${TAG:-latest}
    container_name: aterminal-frontend
    ports:
      - "3000:8080"
    # Pas d'env_file : la conf frontend (VITE_API_URL) est inlinée au build dans la CI.
    restart: unless-stopped
