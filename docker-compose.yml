services:
  api:
    build:
      context: ./api
      dockerfile: dockerfile
    container_name: aterminal-api
    ports:
     - "8000:8000"
    env_file:
      - ./api/.env
    # Permet aux conteneurs de joindre la machine hôte (tunnel SSH en local,
    # ou Postgres du VPS en prod) via le nom "host.docker.internal".
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  engine:
    build:
      context: ./engine
      dockerfile: dockerfile
    container_name: aterminal-engine
    env_file:
      - ./engine/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: aterminal-frontend
    ports:
     - "3000:8080"
    env_file:
      - ./frontend/.env
    restart: unless-stopped
